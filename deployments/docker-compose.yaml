services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      ai-infra:
        aliases:
          - redis

  agent-exec-engine:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - REDIS_URL=redis://redis:6379
      - AI_INFRA_GATEWAY_URL=http://ai-inference-gateway:8080
      - AI_INFRA_SCHEDULER_URL=http://api-server:8080
    depends_on:
      - redis
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # sandbox needs Docker access
    networks:
      - ai-infra

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - ai-infra

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ../configs/grafana:/var/lib/grafana/dashboards
      - ../configs/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - ai-infra

volumes:
  redis-data:

networks:
  ai-infra:
    name: ai-infra-platform-push_default
    external: true
