name: Demo Smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC
  workflow_dispatch:

jobs:
  demo-smoke:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build server
        run: go build -o bin/agent-exec-engine ./cmd/server

      - name: Start server
        run: |
          REDIS_URL=redis://localhost:6379 ./bin/agent-exec-engine &
          sleep 3

      - name: Run demo workflow smoke
        run: bash ./scripts/run_demo_workflow.sh
        env:
          BASE_URL: http://127.0.0.1:8080
          MAX_ATTEMPTS: 30
          POLL_SECONDS: 2

      - name: Capture runtime artifact
        if: always()
        run: |
          mkdir -p evidence/runtime
          curl -sS http://127.0.0.1:8080/metrics > evidence/runtime/metrics-latest.txt || true
          date -u '+%Y-%m-%dT%H:%M:%SZ' > evidence/runtime/last-smoke-run.txt

      - name: Upload demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-smoke-evidence
          path: evidence/runtime/
          retention-days: 30
